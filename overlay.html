<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AudiBot</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
      font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: #e9eefb; }
    #panel { position: fixed; top: 8px; left: 8px; right: 8px; max-height: 390px; overflow-y: auto; display: none;
      background: #111a2b; border: 1px solid #1f2c44; border-radius: 14px; padding: 12px; }
    #panel.on { display: block; }
    #linea { margin: 0 0 6px; }
    .resumen { margin: 0 0 10px; color: #a8b7d0; font-size: 13px; }
    .tarj { border: 1px solid #1f2c44; border-left: 4px solid #94a3b8; border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; background: rgba(148,163,184,.07); }
    .tarj.alert { border-left-color: #f59e0b; } .tarj.ok { border-left-color: #22c55e; }
    .tarj b { font-size: 13px; } .tarj span { float: right; font-size: 11px; font-weight: 700; color: #a8b7d0; }
    .tarj.alert span { color: #fbbf24; } .tarj.ok span { color: #4ade80; }
    .tarj p { margin: 4px 0 0; font-size: 13px; } .tarj small { color: #7f90ae; }
    #cerrar { display: none; margin-top: 6px; padding: 6px 14px; border: 1px solid #1f2c44; border-radius: 8px; background: #162135; color: inherit; cursor: pointer; }
    #robotStage { position: fixed; left: 0; right: 0; bottom: 0; height: 230px; }
    #robotStage canvas { display: block; width: 100%; height: 100%; }
    .oculto { display: none; }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module" src="js/robot.js"></script>
  <script src="js/overlay.js" defer></script>
</head>
<body>
  <div id="panel"><p id="linea"></p><div id="tarjeta"></div><button id="cerrar" type="button">Entendido</button></div>
  <div id="robotStage"><span class="oculto" id="robotLabel"></span><span class="oculto" id="robotDot"></span></div>
</body>
</html>
